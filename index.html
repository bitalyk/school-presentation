<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prezentări de fizică</title>
  <meta name="description" content="Prezentări pentru lecțiile de fizică: clasa a 8-a, clasa a 9-a și clasa a 10-a.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-root="">
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="index.html"><img src="assets/favicon.svg" alt="" width="28" height="28"> Fizică</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">Materiale pentru lecții</p>
      <h1>Prezentări de fizică</h1>
      <p class="lead">Alege clasa pentru a vedea prezentările pe teme.</p>
      <svg class="unda" viewBox="0 0 220 24" aria-hidden="true">
        <defs>
          <linearGradient id="unda-grad" x1="0" x2="1">
            <stop offset="0" style="stop-color: var(--c8)"/>
            <stop offset="0.5" style="stop-color: var(--c9)"/>
            <stop offset="1" style="stop-color: var(--c10)"/>
          </linearGradient>
        </defs>
        <path d="M2 12 Q 15.5 0 29 12 T 56 12 T 83 12 T 110 12 T 137 12 T 164 12 T 191 12 T 218 12"
              fill="none" stroke="url(#unda-grad)" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </section>

    <nav class="clase" aria-label="Clase">
      <a class="clasa-card clasa-8" href="clasa-8/index.html">
        <span class="clasa-nr">8</span>
        <span>
          <span class="clasa-nume">Clasa a 8-a</span>
          <span class="clasa-count" data-count="8">&nbsp;</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="clasa-card clasa-9" href="clasa-9/index.html">
        <span class="clasa-nr">9</span>
        <span>
          <span class="clasa-nume">Clasa a 9-a</span>
          <span class="clasa-count" data-count="9">&nbsp;</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="clasa-card clasa-10" href="clasa-10/index.html">
        <span class="clasa-nr">10</span>
        <span>
          <span class="clasa-nume">Clasa a 10-a</span>
          <span class="clasa-count" data-count="10">&nbsp;</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="wrap">Prezentări de fizică</div>
  </footer>

  <script src="assets/js/prezentari.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
